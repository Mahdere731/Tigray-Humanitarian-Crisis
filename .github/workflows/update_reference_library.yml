name: Update Reference Library

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-reference-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser

      - name: Run reference updater
        id: updater
        run: |
          output=$(python scripts/update_reference_library.py)
          echo "$output"

          count=$(echo "$output" | awk -F= '/^NEW_REFERENCES_COUNT=/{print $2}' | tail -n1)
          if [ -z "$count" ]; then
            count=0
          fi

          echo "new_count=$count" >> "$GITHUB_OUTPUT"

      - name: Commit and push updates
        if: steps.updater.outputs.new_count != '0'
        env:
          NEW_COUNT: ${{ steps.updater.outputs.new_count }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add references/Reference-Library.md data/processed_sources.json

          if git diff --cached --quiet; then
            echo "No staged reference changes detected."
            exit 0
          fi

          git commit -m "docs: add ${NEW_COUNT} new Tigray references"
          git push
