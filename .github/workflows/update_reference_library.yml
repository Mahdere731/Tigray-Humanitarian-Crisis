name: Update Reference Library

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-reference-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run reference-library updater
        run: python scripts/update_reference_library.py

      - name: Commit and push changes when new references exist
        run: |
          if git diff --quiet -- references/Reference-Library.md data/processed_sources.json; then
            echo "No new references were added."
            exit 0
          fi

          added_count=$(python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/reference_update_report.json").read_text(encoding="utf-8"))
          print(int(report.get("new_references_added", 0)))
          PY
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references/Reference-Library.md data/processed_sources.json
          git commit -m "docs: add ${added_count} new Tigray references"
          git push
