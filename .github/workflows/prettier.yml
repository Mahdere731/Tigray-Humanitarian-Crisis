name: Auto-Format Markdown

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# EXPLICITLY PERMIT GITHUB TO SAVE AND PUSH THE FORMATTED FILES
permissions:
  contents: write

jobs:
  prettier:
    if: >-
      ${{ github.actor != 'github-actions[bot]' &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, 'chore: auto-format markdown')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Format Markdown with Prettier
        run: npx --yes prettier@3 --write "**/*.md"

      - name: Commit and push formatting changes
        run: |
          if git diff --quiet; then
            echo "No markdown formatting changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.md'
          git commit -m "chore: auto-format markdown [skip ci]"
          git push
