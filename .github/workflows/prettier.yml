name: Auto-Format Markdown

on:
  push:
    branches: [ main ] # Runs every time you save changes to main
  workflow_dispatch:  # Allows you to run it manually anytime

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Prettier
        uses: creyder/prettier_action@v4.3
        with:
          # Targets all Markdown files and auto-commits the clean code
          prettier_options: --write **/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
