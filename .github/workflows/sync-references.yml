name: Sync References

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-references:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run reference sync
        run: python scripts/sync_references.py

      - name: Commit and push updates
        run: |
          if git diff --quiet; then
            echo "No reference updates detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references/Reference-Library.md references/reference-sync-report.json
          git commit -m "chore: sync references"
          git push
